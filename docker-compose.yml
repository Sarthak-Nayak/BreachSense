version: '3.8'

services:
  simulation:
    build: ./simulation
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHON_SIM_URL=http://simulation:8000
    depends_on:
      - simulation

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
